name: nutrio
description: A nutrition tracking Flutter application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & local storage
  http: ^1.4.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.1
  path: ^1.8.3

  # Authentication
  flutter_facebook_auth: ^6.1.0
  google_sign_in: ^6.1.5

  # UI and utilities
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  intl: ^0.18.1
  uuid: ^4.0.0
  fl_chart: ^0.66.0
  syncfusion_flutter_gauges: ^24.1.41

  # Images and camera
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  image: ^4.5.4

  # Health tracking
  pedometer: ^4.1.1

  # Permissions and file management
  permission_handler: ^12.0.0+1
  open_file: ^3.2.1

  # PDF and screenshot
  pdf: ^3.10.4
  printing: ^5.11.0
  screenshot: ^3.0.0

  # Email sending
  flutter_email_sender: ^7.0.0
  mailer: ^6.0.1

  # AI Model
  tflite_flutter: ^0.11.0

  # Push notifications OneSignal & local notifications
  onesignal_flutter: ^5.0.0
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3 #

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#A4D65E"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#A4D65E"
    theme_color: "#A4D65E"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/cups/

    # Specific images
    - assets/images/app_screenshot.png
    - assets/images/logo1.png
    - assets/images/profile.jpg
    - assets/images/phone_success.png

    # Specific icons
    - assets/icons/google.png
    - assets/icons/apple_white.png
    - assets/icons/apple_black.png
    - assets/icons/facebook.png
    - assets/icons/app_icon.png # Added from the second pubspec

    # Cups & glasses
    - assets/cups/cup_small.png
    - assets/cups/cup_tea.png
    - assets/cups/cup_medium.png
    - assets/cups/cup_large.png
    - assets/cups/glass_small.png
    - assets/cups/glass_medium.png
    - assets/cups/glass_large.png
    - assets/cups/bottle_small.png
    - assets/cups/bottle_medium.png
    - assets/cups/bottle_large.png

    # AI Model and labels
    - assets/verygoodmodel76.tflite
    - assets/labels.txt